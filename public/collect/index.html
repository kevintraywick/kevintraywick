<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collect</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Thumbnail strip */
    #thumbstrip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      background: #1a1a1a;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    #thumbs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .thumb {
      flex-shrink: 0;
      width: 72px;
      height: 48px;
      border-radius: 4px;
      background: #282828;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      font-size: 9px;
      color: #888;
      text-align: center;
      padding: 2px 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
      transition: border-color 0.15s, opacity 0.15s;
    }
    .thumb:active { cursor: grabbing; }
    .thumb.active { border-color: #5af; }
    .thumb:hover:not(.active) { border-color: #444; }
    .thumb.drag-over { border-color: #f80; }
    .thumb.dragging { opacity: 0.3; }


    /* Drop zone */
    #dropzone, #urlbtn {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px dashed #444;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 22px;
      color: #555;
      transition: border-color 0.15s, color 0.15s;
      background: none;
    }
    #dropzone:hover, #dropzone.drag-hover, #urlbtn:hover, #urlbtn.drag-hover { border-color: #5af; color: #5af; }

    /* URL input bar */
    #url-bar {
      display: none;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    #url-bar.visible { display: flex; }
    #url-bar input {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      width: 260px;
      outline: none;
    }
    #url-bar input:focus { border-color: #5af; }
    #url-bar button {
      background: #5af;
      color: #111;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Delete button */
    #deletebtn {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border: none;
      background: none;
      font-size: 24px;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    #deletebtn:hover { background: #332; }

    /* Box label (top-left) */
    #boxlabel {
      flex-shrink: 0;
      font-size: 11px;
      color: #666;
      padding: 0 8px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      user-select: none;
    }
    #boxlabel a { color: inherit; text-decoration: none; }
    #boxlabel a:hover { color: #5af; }

    /* Nav controls group — in the flow, pushed right with margin-left:auto */
    #nav-controls {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    button.nav-arrow {
      flex-shrink: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      line-height: 1;
      transition: opacity 0.1s;
      user-select: none;
    }
    button.nav-arrow:hover { opacity: 0.6; }

    #counter {
      flex-shrink: 0;
      font-size: 11px;
      color: #555;
      min-width: 36px;
      text-align: center;
    }

    #viewer {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #viewer img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    #viewer iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    /* URL pane — the iframe plus an escape hatch, since most sites
       (github, nytimes, google…) send X-Frame-Options and render blank */
    .urlpane {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .urlbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      background: #1a1a1a;
      font-size: 12px;
      color: #666;
    }
    .urlbar .u { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .urlbar a { color: #5af; text-decoration: none; flex-shrink: 0; margin-left: auto; }
    .urlbar a:hover { text-decoration: underline; }

    /* Full-page drop overlay — the whole window is the target, so a
       dragged link can't miss the way a 48px circle could */
    #dropoverlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(17,17,17,0.85);
      border: 3px dashed #5af;
      color: #5af;
      font-size: 22px;
      letter-spacing: 0.02em;
      pointer-events: none; /* keep dragenter/leave targeting the real elements */
    }
    #dropoverlay.visible { display: flex; }

    /* Undo toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #toast button {
      background: #5af;
      color: #111;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    /* Hidden file input */
    #fileinput { display: none; }
  </style>
</head>
<body>
  <div id="thumbstrip">
    <div id="boxlabel"><a href="/" title="Home" target="_top">←</a> <span id="boxname"></span></div>
    <div id="dropzone" title="Drop or click to add files">+</div>
    <button id="urlbtn" title="Add webpage URL">🔗</button>
    <div id="url-bar">
      <input type="text" id="urlinput" placeholder="https://example.com" />
      <button onclick="addUrl()">Add</button>
    </div>
    <div id="thumbs"></div>
    <button id="deletebtn" title="Delete current page">🔥</button>
  </div>
  <input type="file" id="fileinput" accept="image/*,.pdf,.html,.htm" multiple />

  <div id="viewer"></div>

  <div id="dropoverlay">Drop a link or file to add a page</div>

  <div id="toast">
    <span id="toast-msg"></span>
    <button onclick="undoDelete()">Undo</button>
  </div>

  <script>
    // --- Slug from query string (?box=foo). Sanitized to [a-z0-9-]. ---
    const params = new URLSearchParams(location.search)
    const rawSlug = (params.get('box') || 'general').toLowerCase()
    const slug = rawSlug.replace(/[^a-z0-9-]/g, '').slice(0, 64) || 'general'
    const STORAGE_KEY = 'collect_' + slug

    // --- Upload API (kt-feed-api on Railway) ---
    const API_URL = 'https://kt-feed-api-production.up.railway.app'

    async function uploadImage(file) {
      const body = new FormData()
      body.append('image', file)
      const res = await fetch(`${API_URL}/uploads`, { method: 'POST', body })
      if (!res.ok) throw new Error(`Upload failed (${res.status})`)
      const data = await res.json()
      return data.url
    }

    document.title = 'Collect: ' + slug
    document.getElementById('boxname').textContent = slug

    let files = []
    let index = 0
    let undoStack = [] // { file, index, position }
    let undoTimer = null

    // --- Pull a usable http(s) URL out of a drop ---
    //     text/uri-list is RFC 2483: CRLF-separated, and '#' lines are comments.
    //     Some sources (Finder, Mail, Notes) also attach a .webloc/.url file
    //     alongside the URL, so never gate URL handling on files.length.
    function extractDroppedUrl(dt) {
      if (!dt) return null
      const blobs = [dt.getData('text/uri-list'), dt.getData('text/plain'), dt.getData('URL')]
      for (const blob of blobs) {
        if (!blob) continue
        for (const raw of blob.split(/[\r\n]+/)) {
          const line = raw.trim()
          if (!line || line.startsWith('#')) continue
          try {
            const u = new URL(line)
            if (u.protocol === 'http:' || u.protocol === 'https:') return u.href
          } catch { /* not a URL — try the next line */ }
        }
      }
      return null
    }

    function hostLabel(url) {
      try { return new URL(url).hostname.replace(/^www\./, '') } catch { return url }
    }

    function addUrlPage(url) {
      const name = hostLabel(url)
      files.push({ name, type: 'url', url })
      index = files.length - 1
      saveState()
      render()
      showToast(`Added ${name}`, false)
    }

    // --- Page-wide drop handling ---
    //     The whole window is the drop target. Anything that isn't handled must
    //     still preventDefault, or the browser navigates away from the flipbook.
    function handleDrop(e) {
      e.preventDefault()
      hideDropOverlay()
      dropzone.classList.remove('drag-hover')
      if (dragIndex !== null) return // internal thumbnail reorder, not an add

      const url = extractDroppedUrl(e.dataTransfer)
      if (url) { addUrlPage(url); return }

      const droppedFiles = e.dataTransfer && e.dataTransfer.files
      if (droppedFiles && droppedFiles.length) { handleFiles(droppedFiles); return }

      showToast("Couldn't read that drop — try a link or an image/PDF/HTML file", false)
    }

    // Overlay visibility. dragenter/dragleave fire per element crossed, so
    // count them rather than toggling on the first leave.
    let dragDepth = 0

    function showDropOverlay() {
      document.getElementById('dropoverlay').classList.add('visible')
    }
    function hideDropOverlay() {
      dragDepth = 0
      document.getElementById('dropoverlay').classList.remove('visible')
    }

    document.addEventListener('dragenter', e => {
      e.preventDefault()
      dragDepth++
      if (dragIndex === null) showDropOverlay()
    })
    document.addEventListener('dragover', e => {
      e.preventDefault()
      if (dragIndex === null && e.dataTransfer) e.dataTransfer.dropEffect = 'copy'
    })
    document.addEventListener('dragleave', () => {
      dragDepth--
      if (dragDepth <= 0) hideDropOverlay()
    })
    document.addEventListener('drop', handleDrop)
    // A drag that starts outside the browser and is cancelled (Esc, dropped on
    // another app) can leave the counter unbalanced — never strand the overlay.
    document.addEventListener('dragend', hideDropOverlay)
    window.addEventListener('blur', hideDropOverlay)

    // --- Persistence ---
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ files, index }))
      } catch (err) {
        // localStorage quota is ~5–10 MB; large JPGs as base64 data URLs blow it easily.
        showToast('Storage full — file kept in this session only')
        console.warn('saveState failed:', err)
      }
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY))
        if (saved && saved.files && saved.files.length) return saved
      } catch {}
      return null
    }

    // --- Thumbnails ---
    function renderThumbs() {
      const container = document.getElementById('thumbs')
      container.innerHTML = ''
      const mid = Math.ceil(files.length / 2)

      files.forEach((f, i) => {
        // Insert nav controls at the midpoint
        if (i === mid) {
          container.appendChild(makeNavControls())
        }

        const el = document.createElement('div')
        el.className = 'thumb' + (i === index ? ' active' : '')
        el.draggable = true
        el.dataset.index = i

        // URL tiles are named by hostname — stripping ".com" off it would
        // leave "nytimes", so only strip extensions from real filenames
        const label = f.type === 'url' ? f.name : f.name.replace(/\.[^.]+$/, '')
        el.textContent = label.length > 20 ? label.slice(0, 18) + '...' : label

        el.addEventListener('click', () => { index = i; render() })
        el.addEventListener('dragstart', onThumbDragStart)
        el.addEventListener('dragover', onThumbDragOver)
        el.addEventListener('dragenter', onThumbDragEnter)
        el.addEventListener('dragleave', onThumbDragLeave)
        el.addEventListener('drop', onThumbDrop)
        el.addEventListener('dragend', onThumbDragEnd)

        container.appendChild(el)
      })

      // If no files or only one half, still add controls
      if (files.length === 0 || mid === files.length) {
        container.appendChild(makeNavControls())
      }
    }

    function makeNavControls() {
      const nav = document.createElement('div')
      nav.id = 'nav-controls'
      nav.innerHTML = `
        <button class="nav-arrow" onclick="go(-1)">&#8592;</button>
        <span id="counter">${files.length ? (index + 1) + ' / ' + files.length : '0 / 0'}</span>
        <button class="nav-arrow" onclick="go(1)">&#8594;</button>
      `
      return nav
    }

    // --- Drag to reorder ---
    let dragIndex = null

    function onThumbDragStart(e) {
      dragIndex = +this.dataset.index
      this.classList.add('dragging')
      e.dataTransfer.effectAllowed = 'move'
      e.dataTransfer.setData('text/plain', dragIndex)
    }

    function onThumbDragOver(e) {
      e.preventDefault()
      e.dataTransfer.dropEffect = 'move'
    }

    function onThumbDragEnter(e) {
      e.preventDefault()
      if (dragIndex !== null) this.classList.add('drag-over')
    }

    function onThumbDragLeave() {
      this.classList.remove('drag-over')
    }

    function onThumbDrop(e) {
      e.preventDefault()
      e.stopPropagation() // reordering, not an add — keep handleDrop out of it
      this.classList.remove('drag-over')
      const from = dragIndex
      const to = +this.dataset.index
      if (from === null || from === to) return

      const [moved] = files.splice(from, 1)
      files.splice(to, 0, moved)

      // Update current index to follow the viewed page
      if (index === from) {
        index = to
      } else if (from < index && to >= index) {
        index--
      } else if (from > index && to <= index) {
        index++
      }

      saveState()
      render()
    }

    function onThumbDragEnd() {
      dragIndex = null
      document.querySelectorAll('.thumb').forEach(t => {
        t.classList.remove('dragging', 'drag-over')
      })
    }

    // --- Drop zone (add files) ---
    const dropzone = document.getElementById('dropzone')
    const fileinput = document.getElementById('fileinput')

    dropzone.addEventListener('click', () => fileinput.click())

    // Drops are handled page-wide by handleDrop — these only add hover feedback
    // for the circle itself. A second 'drop' listener here would double-add.
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-hover') })
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-hover'))

    fileinput.addEventListener('change', () => {
      handleFiles(fileinput.files)
      fileinput.value = ''
    })

    // --- URL input ---
    const urlbtn = document.getElementById('urlbtn')
    const urlbar = document.getElementById('url-bar')
    const urlinput = document.getElementById('urlinput')

    urlbtn.addEventListener('click', () => {
      urlbar.classList.toggle('visible')
      if (urlbar.classList.contains('visible')) urlinput.focus()
    })

    // The 🔗 circle looks like a drop target (same dashed styling as +), so it
    // has to behave like one. The drop itself is handled page-wide.
    urlbtn.addEventListener('dragover', e => { e.preventDefault(); urlbtn.classList.add('drag-hover') })
    urlbtn.addEventListener('dragleave', () => urlbtn.classList.remove('drag-hover'))
    urlbtn.addEventListener('drop', () => urlbtn.classList.remove('drag-hover'))

    urlinput.addEventListener('keydown', e => {
      if (e.key === 'Enter') addUrl()
      if (e.key === 'Escape') urlbar.classList.remove('visible')
    })

    function addUrl() {
      let url = urlinput.value.trim()
      if (!url) return
      if (!/^https?:\/\//.test(url)) url = 'https://' + url

      urlinput.value = ''
      urlbar.classList.remove('visible')
      addUrlPage(url)
    }

    // Shortcut files carry a URL as text, not as content to display:
    // .webloc is an XML plist, .url is an INI with a URL= line.
    function addShortcutFile(file) {
      const reader = new FileReader()
      reader.onload = () => {
        const match = String(reader.result).match(/https?:\/\/[^\s"'<>]+/)
        if (match) addUrlPage(match[0])
        else showToast(`Couldn't find a link in ${file.name}`, false)
      }
      reader.readAsText(file)
    }

    function handleFiles(fileList) {
      Array.from(fileList).forEach(async file => {
        const ext = file.name.split('.').pop().toLowerCase()
        if (ext === 'url' || ext === 'webloc') { addShortcutFile(file); return }

        let type = 'html'
        if (['png','jpg','jpeg','gif','webp','svg','bmp'].includes(ext)) type = 'image'
        else if (ext === 'pdf') type = 'pdf'

        // Images go to the API (no localStorage quota); other types stay inline as data URLs.
        if (type === 'image') {
          try {
            const url = await uploadImage(file)
            files.push({ name: file.name, type: 'image', url })
            index = files.length - 1
            saveState()
            render()
          } catch (err) {
            showToast(err.message || 'Upload failed')
            console.warn('uploadImage failed:', err)
          }
          return
        }

        const reader = new FileReader()
        reader.onload = () => {
          files.push({ name: file.name, type, dataUrl: reader.result })
          index = files.length - 1
          saveState()
          render()
        }
        reader.readAsDataURL(file)
      })
    }

    // --- Delete with undo ---
    document.getElementById('deletebtn').addEventListener('click', deleteCurrent)

    function deleteCurrent() {
      if (!files.length) return
      const removed = files[index]
      const removedIndex = index

      files.splice(index, 1)
      if (index >= files.length) index = Math.max(0, files.length - 1)
      saveState()

      undoStack.push({ file: removed, position: removedIndex })
      showToast(`Deleted "${removed.name.replace(/\.[^.]+$/, '')}"`)
      render()
    }

    function undoDelete() {
      if (!undoStack.length) return
      const { file, position } = undoStack.pop()
      const insertAt = Math.min(position, files.length)
      files.splice(insertAt, 0, file)
      index = insertAt
      saveState()
      hideToast()
      render()
    }

    function showToast(msg, withUndo = true) {
      const toast = document.getElementById('toast')
      document.getElementById('toast-msg').textContent = msg
      toast.querySelector('button').style.display = withUndo ? '' : 'none'
      toast.style.display = 'flex'
      clearTimeout(undoTimer)
      undoTimer = setTimeout(hideToast, 5000)
    }

    function hideToast() {
      document.getElementById('toast').style.display = 'none'
      clearTimeout(undoTimer)
    }

    // --- Main render ---
    function render() {
      renderThumbs()
      if (!files.length) {
        document.getElementById('viewer').innerHTML = '<span style="color:#555">No items yet — drop a file, paste a URL, or click +</span>'
        return
      }
      const f = files[index]
      const viewer = document.getElementById('viewer')

      if (f.type === 'image') {
        const src = f.url || f.dataUrl || encodeURIComponent(f.name)
        viewer.innerHTML = `<img src="${src}" alt="${f.name}" />`
      } else if (f.type === 'url') {
        // Most sites refuse framing (X-Frame-Options / frame-ancestors) and go
        // blank, so always surface the URL and a way out to a real tab.
        const pane = document.createElement('div')
        pane.className = 'urlpane'

        const bar = document.createElement('div')
        bar.className = 'urlbar'
        const label = document.createElement('span')
        label.className = 'u'
        label.textContent = f.url
        const open = document.createElement('a')
        open.href = f.url
        open.target = '_blank'
        open.rel = 'noreferrer noopener'
        open.textContent = 'Open ↗'
        bar.append(label, open)

        const frame = document.createElement('iframe')
        frame.src = f.url
        frame.sandbox = 'allow-scripts allow-same-origin allow-popups allow-forms'
        frame.referrerPolicy = 'no-referrer'

        pane.append(bar, frame)
        viewer.innerHTML = ''
        viewer.appendChild(pane)
      } else if (f.dataUrl) {
        // Decode the data URL to HTML and use srcdoc to avoid download behavior
        const iframe = document.createElement('iframe')
        if (f.dataUrl.startsWith('data:text/html')) {
          try {
            const comma = f.dataUrl.indexOf(',')
            const isBase64 = f.dataUrl.slice(0, comma).includes(';base64')
            const payload = f.dataUrl.slice(comma + 1)
            iframe.srcdoc = isBase64 ? atob(payload) : decodeURIComponent(payload)
          } catch { iframe.src = f.dataUrl }
        } else {
          iframe.src = f.dataUrl
        }
        viewer.innerHTML = ''
        viewer.appendChild(iframe)
      } else {
        viewer.innerHTML = `<iframe src="${encodeURIComponent(f.name)}"></iframe>`
      }

      // Scroll active thumb into view
      const active = document.querySelector('.thumb.active')
      if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' })
    }

    function go(dir) {
      if (!files.length) return
      index = (index + dir + files.length) % files.length
      render()
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') go(-1)
      if (e.key === 'ArrowRight') go(1)
      if ((e.key === 'Delete' || e.key === 'Backspace') && !e.metaKey && !e.ctrlKey) deleteCurrent()
      if (e.key === 'z' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); undoDelete() }
    })

    // --- Init ---
    const saved = loadState()
    if (saved) {
      files = saved.files
      index = Math.min(saved.index, files.length - 1)
    }
    if (index < 0) index = 0
    render()
  </script>
</body>
</html>
