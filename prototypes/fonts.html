<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name Fonts</title>
<script src="lib/fonts.js"></script>
<style>
  :root { --ink: #111; --muted: #8a8a8a; --line: #ececec; --pick: #c9a227; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: rgba(255,255,255,.94); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  header a { color: var(--muted); text-decoration: none; }
  header label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  header input[type=text] { font: inherit; border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; width: 160px; }
  .filters button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 3px 11px; cursor: pointer; color: var(--muted); }
  .filters button[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
  #picked { margin-left: auto; color: var(--muted); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
  .card { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 18px 20px 14px; min-height: 190px;
    display: flex; flex-direction: column; justify-content: space-between; position: relative; }
  .card.picked { background: #fffbea; }
  .name { font-size: 64px; line-height: 1.25; padding: 14px 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .meta { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
  .meta b { color: var(--ink); font-weight: 500; font-size: 13px; }
  .meta .try { margin-left: auto; display: flex; gap: 8px; }
  .meta .try a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted #ccc; }
  .meta .try a:hover { color: var(--ink); }
  .star { border: 0; background: none; font-size: 18px; cursor: pointer; color: #d6d6d6; padding: 0; line-height: 1; }
  .picked .star { color: var(--pick); }
</style>
</head>
<body>
<header>
  <h1>Name in italic &amp; script fonts</h1>
  <a href="./">← prototypes</a>
  <label>Text <input type="text" id="text" value="Kevin Traywick"></label>
  <label>Size <input type="range" id="size" min="32" max="120" value="64"></label>
  <span class="filters" id="filters"></span>
  <span id="picked"></span>
</header>
<main id="grid"></main>
<script>
  // ☆ marks favourites (kept in this browser). "try 1/2/3" opens that prototype
  // with the font loaded, so you can see it being written.
  const grid = document.getElementById('grid');
  const KEY = 'sig_font_picks';
  let picks = [];
  try { picks = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch (e) {} };

  const faces = SIG_FONTS.map(f =>
    `@font-face{font-family:"sig-${f.slug}";src:url(${sigFontUrl(f)}) format("woff");font-style:normal;font-display:swap}`).join('');
  document.head.insertAdjacentHTML('beforeend', `<style>${faces}</style>`);

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  for (const f of SIG_FONTS) {
    const card = document.createElement('section');
    card.className = 'card';
    card.dataset.kind = f.kind;
    card.dataset.slug = f.slug;
    card.innerHTML = `
      <div class="name" style="font-family:'sig-${f.slug}'">Kevin Traywick</div>
      <div class="meta">
        <button class="star" title="Mark as a favourite">★</button>
        <b>${esc(f.name)}</b><span>${f.kind}</span>
        <span class="try">try in
          <a href="1-ink.html?font=${f.slug}">1</a><a href="2-gold.html?font=${f.slug}">2</a><a href="3-ember.html?font=${f.slug}">3</a>
        </span>
      </div>`;
    card.querySelector('.star').addEventListener('click', () => {
      picks = picks.includes(f.slug) ? picks.filter(s => s !== f.slug) : [...picks, f.slug];
      save(); paintPicks();
    });
    grid.appendChild(card);
  }

  function paintPicks() {
    for (const c of grid.children) c.classList.toggle('picked', picks.includes(c.dataset.slug));
    document.getElementById('picked').textContent = picks.length
      ? '★ ' + picks.map(s => sigFontBySlug(s).name).join(', ') : '';
  }
  paintPicks();

  // The slider sets the largest size; any name too wide for its card shrinks to fit.
  const sizeInput = document.getElementById('size');
  function fit() {
    for (const n of grid.querySelectorAll('.name')) {
      n.style.fontSize = sizeInput.value + 'px';
      if (n.scrollWidth > n.clientWidth) n.style.fontSize = sizeInput.value * n.clientWidth / n.scrollWidth * 0.97 + 'px';
    }
  }
  document.getElementById('text').addEventListener('input', e => {
    for (const n of grid.querySelectorAll('.name')) n.textContent = e.target.value || ' ';
    fit();
  });
  sizeInput.addEventListener('input', fit);
  addEventListener('resize', fit);
  document.fonts.ready.then(fit);

  const filters = document.getElementById('filters');
  let active = 'All';
  for (const k of ['All', 'Script', 'Signature', 'Italic serif', '★']) {
    const b = document.createElement('button');
    b.textContent = k;
    b.addEventListener('click', () => {
      active = k;
      for (const x of filters.children) x.setAttribute('aria-pressed', x.textContent === k);
      for (const c of grid.children)
        c.hidden = !(k === 'All' || (k === '★' ? picks.includes(c.dataset.slug) : c.dataset.kind === k));
      fit();
    });
    b.setAttribute('aria-pressed', k === 'All');
    filters.appendChild(b);
  }
</script>
</body>
</html>
