<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New York · sample trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="../nyc.css">
</head>
<body class="tiles-gray">

<header class="top">
  <div class="brand">
    <h1>New York</h1>
    <p>December 11–14 · a sample trip</p>
    <p class="wxnote" id="wxnote"></p>
  </div>
  <ol class="days" id="days" aria-label="Our four days"></ol>
  <div class="bills"><span>Invoices</span><div id="bills"></div></div>
</header>

<main class="stage">
  <div id="map"></div>
  <div id="card" hidden></div>
  <div class="legend">
    <div><b id="hint">Point at any dot or star to read about it</b></div>
    <div><span class="ld see"></span>Places to see</div>
    <div><span class="ld eat"></span>Restaurants</div>
    <div><span class="lstar"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg></span>On this year’s 50 Best list</div>
    <div><span class="ls"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg></span>Our hotel</div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="../subway.js"></script>
<script src="../places.js"></script>
<script src="demo.js"></script>
<script src="../invoice.js"></script>
<script src="../nyc.js"></script>
</body>
</html>
